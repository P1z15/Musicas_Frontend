<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Músicas</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <header>
            <div class="logo">
                <div class="icone-disco"></div>
                <h1>Minhas Músicas</h1>
            </div>
            <a href="cadastrar.html" class="link-destaque">
                <span>+</span> Cadastrar música
            </a>
        </header>

        <main>
            <section id="listaMusicas">
                <!-- Card 1 -->
                <article class="musica">
                    <div class="capa-album">🎵</div>
                    <div class="info">
                        <h2>Evidências</h2>
                        <p class="artista">Chitãozinho e Xororó</p>
                        <p class="detalhes">Sertanejo &bull; 1990 &bull; 5 min</p>
                    </div>
                    <div class="acoes">
                        <a class="editar" href="editar.html?id=1">Editar</a>
                        <button class="apagar">Apagar</button>
                    </div>
                </article>

                <!-- Card 2 (Apenas para ver o layout em grid) -->
                <article class="musica">
                    <div class="capa-album">🎸</div>
                    <div class="info">
                        <h2>Bohemian Rhapsody</h2>
                        <p class="artista">Queen</p>
                        <p class="detalhes">Rock &bull; 1975 &bull; 6 min</p>
                    </div>
                    <div class="acoes">
                        <a class="editar" href="editar.html?id=2">Editar</a>
                        <button class="apagar">Apagar</button>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
